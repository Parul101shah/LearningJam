spring:
  application:
    name: job-agent

  # Using H2 for local dev. Switch to PostgreSQL for production.
  datasource:
    url: jdbc:h2:mem:jobagentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- PostgreSQL (uncomment for production) ---
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/jobagent
  #   username: postgres
  #   password: postgres
  # jpa:
  #   hibernate:
  #     ddl-auto: update

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      chat:
        options:
          model: gpt-4o-mini

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Job scraper config
scraper:
  greenhouse:
    companies: airbnb,stripe,figma,discord
  lever:
    companies: netflix,cloudflare

server:
  port: 8080

